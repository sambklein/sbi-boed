---
# Functional experiment configuration for source finding
defaults:
  - dataset_encoder: transformer  # NOTE: the function that calls this is never actually used
  - acquisition: npe
  - hydra: default
  - sbi: default
  - design_net: default
  - _self_
data:
  _target_: sbi_bax.data.source_finding.SourceFindingData
  hyperspherical: true
  simulator:
    _target_: sbi_bax.simulators.source_finding.SourceFinding
    physical_dim: 2
    n_source: 2
  n_points: 1000  # Number of candidate measurement points
  bounded_domain: true
  random_init: false
  n_measure_init: 5
# Experiment settings
seed: 42
output_dir: results
exp_name: cinit_test

# Interpolated variables
full_path: ${output_dir}/${exp_name}
# Measurement parameters
measurement:
  max_measure: 10
  initial_measure: 1
  from_scratch: false
# Evaluation parameters
eval:
  n_contrast: 1e7
